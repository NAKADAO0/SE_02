[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "se02-workflow"
version = "0.3.1"
description = "Three-agent code review workflow with CLI and HTTP model support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
se02 = "se02.cli:main"

[tool.setuptools.package-data]
"se02.web" = ["static/*.html", "static/*.css", "static/*.js"]
